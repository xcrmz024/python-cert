[project]
name = "proyecto_final_integrador"
version = "0.1.0"
description = ""
authors = [
    {name = "karlacr",email = "karlacruzramirez2401@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "fastapi (>=0.142.0,<0.143.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "ruff (>=0.16.7,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)"
]


[tool.poetry]
packages = [
    { include = "proyecto_final_integrador", from = "src" }
]

[tool.ruff.lint]
ignore = ["B008"]